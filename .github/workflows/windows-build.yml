name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # only used to attach the exe to a release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r requirements-windows.txt pyinstaller

      - name: Unit tests (on Windows)
        run: python -m unittest discover tests -v

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name VTGControl2
          --add-data "presets;presets"
          --hidden-import serial.urlhandler.protocol_loop
          main.py

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\VTGControl2.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist\selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VTGControl2-windows
          path: dist/VTGControl2.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VTGControl2.exe
